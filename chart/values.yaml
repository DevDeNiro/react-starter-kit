replicaCount: 1

frontend:
  image:
    registry: docker.io
    repository: noodlesboop/react-starter-kit
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 80
    targetPort:
      http: 80
      https: 443
    nodePorts:
      http: 30080
      https: 30443
  ingress:
    enabled: false

resources: {}