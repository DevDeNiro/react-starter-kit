apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
    name: react-starter-kit-route
    namespace: ns-react-starter-kit
    labels:
        app: react-starter-kit
        app.kubernetes.io/name: react-starter-kit
        app.kubernetes.io/component: frontend
spec:
    parentRefs:
        - name: infrastructure-gateway
          namespace: nginx-gateway
    hostnames:
        - react-starter-kit.local
        - localhost
    rules:
        - matches:
              - path:
                    type: PathPrefix
                    value: /
          backendRefs:
              - name: react-starter-kit-service
                port: 80
