apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: react-starter-kit-ingress
    namespace: ns-react-starter-kit
    labels:
        app: react-starter-kit
        app.kubernetes.io/name: react-starter-kit
        app.kubernetes.io/component: frontend
    annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /
        nginx.ingress.kubernetes.io/ssl-redirect: "false"
        # Optional: Enable CORS for API calls
        nginx.ingress.kubernetes.io/cors-allow-origin: "*"
        nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
        nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
spec:
    ingressClassName: nginx
    rules:
        -   host: react-starter-kit.local
            http:
                paths:
                    -   path: /
                        pathType: Prefix
                        backend:
                            service:
                                name: react-starter-kit-service
                                port:
                                    number: 80